name: Update README

on:
  push:
    paths:
      - '**/*.java'  # Only trigger when Java files are changed

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Run README generator
        run: python3 scripts/generate_readme.py

      - name: Commit updated READMEs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add "**/README.md"
          git commit -m "docs: auto-update README" || echo "No changes"
          git push